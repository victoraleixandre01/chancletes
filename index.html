<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chancletes y Chaletes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111; background: #fff; }

/* SCREENS */
.screen { display: none; width: 100%; height: 100vh; height: 100dvh; }
.screen.active { display: flex; }

/* IDLE SCREEN */
#screen-idle {
  flex-direction: column;
  align-items: center;
  padding: 1.5rem;
  gap: 0.8rem;
  background: #fff;
  overflow: hidden;
}
.logo-bar {
  width: 100%;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem 2rem;
  border-radius: 16px;
  flex-shrink: 0;
}
.site-logo { height: clamp(45px, 7vw, 80px); width: auto; object-fit: contain; flex-shrink: 0; }
.tagline { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: #555; text-align: center; flex-shrink: 0; }

/* TWO COLUMN GRID */
.home-grid {
  width: 100%;
  max-width: 1200px;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: row;
  gap: 1.5rem;
  align-items: flex-start;
}
.home-left {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 0.5rem;
}
.home-label { font-size: 1.1rem; font-weight: 800; color: #111; }
.home-left input {
  width: 100%; padding: 0.9rem 1rem; border-radius: 14px;
  background: #fff; border: 2px solid #f5c800; color: #111;
  font-size: 1.1rem; outline: none; -webkit-appearance: none;
}
.home-left input:focus { border-color: #f5c800; }
.home-left input::placeholder { color: #bbb; }
.home-left input::placeholder { color: #bbb; }
#btn-manual {
  width: 100%; padding: 0.9rem; border-radius: 14px;
  background: #1DB954; border: none; color: #fff;
  font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; -webkit-appearance: none;
}
#btn-manual:active { background: #333; }
#btn-exitos {
  width: 100%; padding: 0.9rem; border-radius: 50px;
  background: #f5c800; border: 2px solid #f5c800;
  color: #111; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; -webkit-appearance: none;
}
#btn-exitos:active { opacity: 0.75; }
#btn-random {
  width: 100%; padding: 0.9rem; border-radius: 50px;
  background: #fff; border: 2px solid #111;
  color: #111; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; -webkit-appearance: none;
}
#btn-start {
  width: 100%; padding: 0.9rem; border-radius: 50px;
  background: rgba(25,20,20,0.07); border: 2px solid rgba(25,20,20,0.2);
  color: #191414; font-size: 1.15rem; font-weight: 700; cursor: pointer; -webkit-appearance: none;
}
#btn-english {
  width: 100%; padding: 0.9rem; border-radius: 50px;
  background: #fff; border: 2px solid #111;
  color: #111; font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; -webkit-appearance: none;
}
#btn-english:active { opacity: 0.75; }
.btn-separator {
  width: 100%;
  height: 1px;
  background: #f5c800;
  margin: 2rem 0 1rem;
}
#btn-random:active { opacity: 0.75; }

/* REPERTOIRE PANEL */
.home-right {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 20px;
  border: 1.5px solid #f5c800;
  overflow: hidden;
  height: calc(100vh - 180px);
  height: calc(100dvh - 180px);
}
.rep-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1.2rem; border-bottom: 1px solid #f5c800; flex-shrink: 0;
}
.rep-title { font-size: 1rem; font-weight: 800; color: #191414; }
#rep-filter {
  padding: 0.45rem 0.9rem; border-radius: 50px;
  background: #fff; border: 1.5px solid #f5c800; color: #111; font-size: 0.85rem; outline: none; width: 150px;
}
#rep-filter:focus { border-color: #f5c800; }
#rep-list {
  overflow-y: auto; flex: 1;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-content: start;
}
.rep-item {
  padding: 0.6rem 0.9rem; cursor: pointer;
  border-bottom: 1px solid #f5f5f5; border-right: 1px solid #f5f5f5;
}
.rep-item:hover { background: #fff; }
.rep-item:active { background: #d4f5e3; }
.rep-item-title { font-weight: 700; font-size: 0.8rem; color: #111; line-height: 1.3; }
.rep-item-artist { font-size: 0.7rem; color: #888; margin-top: 1px; }

#results-list {
  width: 100%; max-height: 180px; overflow-y: auto;
  background: #fff; border: 1.5px solid #f5c800; border-radius: 14px; display: none;
}
.result-item { padding: 0.7rem 1rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
.result-item:last-child { border-bottom: none; }
.result-item:active { background: #fff; }
.result-title { font-weight: 700; font-size: 0.9rem; color: #111; }
.result-artist { font-size: 0.75rem; color: #888; margin-top: 2px; }

.msg { font-size: 0.85rem; color: #e53e3e; text-align: center; min-height: 1em; line-height: 1.5; max-width: 380px; }
.msg.info { color: #1DB954; }

/* LISTENING SCREEN */
#screen-listening {
  flex-direction: column; align-items: center; justify-content: center;
  gap: 1.5rem; background: #fff;
}
.pulse-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
.pr { position: absolute; border-radius: 50%; border: 2px solid rgba(29,185,84,0.3); animation: pr 2s ease-in-out infinite; }
.pr1 { width: 140px; height: 140px; }
.pr2 { width: 105px; height: 105px; border-color: rgba(29,185,84,0.5); animation-delay: .35s; }
.pr3 { width: 74px; height: 74px; border-color: rgba(29,185,84,0.7); animation-delay: .7s; }
@keyframes pr { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.09);opacity:0.5} }
.mic-big { font-size: 3rem; z-index: 1; }
#waveform { display: flex; align-items: center; gap: 5px; height: 50px; }
.bar { width: 6px; background: #1DB954; border-radius: 3px; height: 8px; animation: wv 1s ease-in-out infinite; }
@keyframes wv { 0%,100%{height:8px} 50%{height:44px} }
.listen-lbl { font-size: 1rem; color: #555; text-align: center; line-height: 1.9; }
.listen-lbl b { color: #1DB954; font-weight: 600; }
.timer-arc { font-size: 2.5rem; font-weight: 800; color: #1DB954; }


/* FOUND SCREEN */
#screen-found {
  flex-direction: column; align-items: center; justify-content: center;
  gap: 1.3rem; background: #fff;
}
.badge-ok { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #1DB954; padding: 0.3rem 1rem; border-radius: 50px; border: 1px solid rgba(29,185,84,0.4); background: rgba(29,185,84,0.08); }
#found-title { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; text-align: center; max-width: 480px; line-height: 1.2; color: #111; }
#found-artist { font-size: 1rem; color: #666; }
.loading-lyrics { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; }
.spinner { width: 34px; height: 34px; border: 3px solid #eee; border-top-color: #1DB954; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: 0.9rem; color: #1DB954; }
.found-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn-p { padding: 0.9rem 2.2rem; border-radius: 50px; background: #1DB954; border: none; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
.btn-p:active { background: #17a344; }
.btn-s { padding: 0.9rem 1.8rem; border-radius: 50px; background: transparent; border: 1.5px solid #ccc; color: #666; font-size: 1rem; cursor: pointer; -webkit-appearance: none; }

/* KARAOKE SCREEN */
#screen-karaoke {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  flex-direction: column; background: #fff;
}
#screen-karaoke.active { display: flex; }
#k-hdr {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 10px;
  padding: 0.6rem 1rem; width: 100%; flex-shrink: 0;
  background: #111; border-bottom: 1px solid #222; z-index: 10;
}
.k-logo-img { height: 42px; width: auto; object-fit: contain; cursor: pointer; }
.k-song { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; text-align: center; }
.k-song .kt { font-size: 1rem; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
.k-song .ka { font-size: 0.8rem; color: #f5c800; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center; }
.k-btns { display: flex; gap: 5px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.k-btns button { height: 36px; min-width: 36px; padding: 0 11px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 700; color: #fff; cursor: pointer; -webkit-appearance: none; display: flex; align-items: center; justify-content: center; }
.k-btns button:active { opacity: 0.7; transform: scale(0.95); }
#btn-play { background: #f5c800; display: flex; color: #111; }
#btn-pause { background: #1DB954; display: none; }
#btn-slower { background: #333; color: #fff; }
#btn-faster { background: #333; color: #fff; }
#btn-rst { background: #333; color: #fff; }
#btn-exit { background: #333; color: #ff6b6b; font-size: 0.78rem; padding: 0 14px; }
#speed-badge { height: 36px; min-width: 40px; padding: 0 10px; border-radius: 8px; background: #333; font-size: 0.78rem; font-weight: 800; color: #f5c800; display: flex; align-items: center; justify-content: center; }
#lyrics-win { flex: 1; width: 100%; overflow: hidden; position: relative; touch-action: pan-y; background: #fff; }
#lyrics-box { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 0 1.5rem; will-change: transform; }
.ll { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 700; text-align: center; color: #111; line-height: 1.4; padding: 0.1rem 0.5rem; cursor: pointer; user-select: none; width: 100%; }
#k-ftr { padding: 0.5rem 1rem; width: 100%; flex-shrink: 0; background: #111; border-top: 1px solid #222; z-index: 10; }
#prog-track { width: 100%; height: 4px; background: #333; border-radius: 2px; cursor: pointer; touch-action: none; }
#prog-fill { height: 100%; background: #f5c800; border-radius: 3px; width: 0%; pointer-events: none; }
.time-row { display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.74rem; color: #888; }

/* MOBILE */
@media (max-width: 700px) {
  html, body { overflow: hidden; height: 100%; height: 100dvh; }
  .screen { height: 100vh; height: 100dvh; }
  #screen-idle { padding: 0.7rem 0.85rem 0.5rem; gap: 0.45rem; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
  .logo-bar { padding: 0.55rem 1rem; border-radius: 12px; flex-shrink: 0; }
  .site-logo { height: clamp(32px, 8vw, 46px); }
  .tagline { font-size: 0.6rem; flex-shrink: 0; }
  .home-grid { flex-direction: row; gap: 0.6rem; flex: 1; min-height: 0; overflow: hidden; align-items: stretch; }
  .home-left { width: 148px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .home-label { font-size: 0.78rem; font-weight: 800; }
  .home-left input { padding: 0.6rem 0.75rem; font-size: 0.85rem; border-radius: 10px; }
  #btn-manual { padding: 0.6rem; font-size: 0.82rem; border-radius: 10px; }
  .btn-separator { margin: 1.8rem 0 0.8rem; }
  #btn-exitos, #btn-random, #btn-english { padding: 0.55rem 0.5rem; font-size: 0.78rem; border-radius: 40px; }
  #idle-msg { font-size: 0.72rem; }
  .home-right { flex: 1; min-width: 0; height: auto; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .rep-header { padding: 0.55rem 0.8rem; }
  .rep-title { font-size: 0.85rem; }
  #rep-filter { width: 90px; font-size: 0.75rem; padding: 0.3rem 0.6rem; }
  #rep-list { grid-template-columns: repeat(1, 1fr); overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  .rep-item { padding: 0.55rem 0.8rem; }
  .rep-item-title { font-size: 0.82rem; }
  .rep-item-artist { font-size: 0.68rem; }
  html.karaoke-active, body.karaoke-active { overflow: hidden; height: 100%; }
  .k-logo-img { height: 28px; }
  #k-hdr { padding: 0.4rem 0.7rem; gap: 6px; }
  .k-song .kt { font-size: 0.82rem; }
  .k-song .ka { font-size: 0.68rem; }
  .k-btns { gap: 4px; }
  .k-btns button { height: 32px; min-width: 32px; padding: 0 6px; font-size: 0.78rem; border-radius: 6px; }
  #btn-exit { height: 32px; padding: 0 10px; font-size: 0.72rem; }
  #speed-badge { height: 32px; min-width: 32px; font-size: 0.7rem; border-radius: 6px; }
  .ll { font-size: clamp(1.4rem, 5.5vw, 2rem); }
}
</style>
</head>

function norm(s){if(!s)return'';var r=s.toLowerCase().normalize('NFD'),o='';for(var i=0;i<r.length;i++){var c=r.charCodeAt(i);if(c<0x0300||c>0x036f)o+=r[i];}return o.replace(/[^a-z0-9 ]/g,'').trim();}
function fuzzyScore(text,query){
  var t=norm(text),q=norm(query);
  if(!q)return 0;
  if(t.indexOf(q)!==-1)return 0;
  var qw=q.split(' ').filter(Boolean);
  if(qw.every(function(w){return t.indexOf(w)!==-1;}))return 1;
  var tw=t.split(' ').filter(Boolean);
  if(qw.length&&qw.every(function(a){return tw.some(function(b){return b.indexOf(a)===0;});}))return 2;
  function lev(a,b){var m=a.length,n=b.length,dp=[];for(var i=0;i<=m;i++){dp[i]=[i];for(var j=1;j<=n;j++)dp[i][j]=0;}for(var j=0;j<=n;j++)dp[0][j]=j;for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
  var me=function(w){return w.length<=3?0:w.length<=5?1:2;};
  var hits=qw.filter(function(a){return tw.some(function(b){return lev(a,b)<=me(a);});}).length;
  if(hits===qw.length)return 3;
  if(hits>0)return 10-hits;
  return -1;
}

function score(item,qa){
  var t=item.trackName||'',a=item.artistName||'',s=0;
  if(/\(/.test(t))s+=20;if(/\[/.test(t))s+=20;
  if(/\bfeat\b|\bft\b/i.test(t))s+=15;if(/\bfeat\b|\bft\b/i.test(a))s+=15;

// Render repertoire
function renderRepList(filter,pool){
  var list=document.getElementById('rep-list');if(!list)return;
  list.innerHTML='';
  var source=pool||REPERTORIO,f=(filter||'').trim(),items;
  if(!f){
    items=source.map(function(s){return{s:s};});
  } else {
    items=[];
    source.forEach(function(s){
      var sc=Math.min(fuzzyScore(s.title,f),s.artist?fuzzyScore(s.artist,f):999);
      if(sc>=0)items.push({s:s,sc:sc});
    });
    items.sort(function(a,b){return a.sc-b.sc;});
  }
  items.forEach(function(it){
    var s=it.s,div=document.createElement('div');div.className='rep-item';
    var t=document.createElement('div');t.className='rep-item-title';t.textContent=s.title;
    var a=document.createElement('div');a.className='rep-item-artist';a.textContent=s.artist;
    div.appendChild(t);div.appendChild(a);
    div.addEventListener('click',function(){showFoundAndLoad(s.title,s.artist,null);});
    list.appendChild(div);
  });
}

var _acTimer=null, _acSeq=0;

function showDropdownResults(inp, list, items){
  if(!items.length){list.style.display='none';list.innerHTML='';inp.classList.remove('dropdown-open');return;}
  list.innerHTML='';
  items.forEach(function(item){
    var div=document.createElement('div');div.className='result-item';
    var t=document.createElement('div');t.className='result-title';t.textContent=item.title;
    var a=document.createElement('div');a.className='result-artist';a.textContent=item.artist||'';
    div.appendChild(t);if(item.artist)div.appendChild(a);
    function pick(e){
      if(e&&e.preventDefault)e.preventDefault();
      inp.value=item.title+(item.artist?' - '+item.artist:'');
      list.style.display='none';list.innerHTML='';inp.classList.remove('dropdown-open');
      inp.blur();setMsg('idle-msg','');showFoundAndLoad(item.title,item.artist,null);
    }
    div.addEventListener('touchend',pick);
    div.addEventListener('click',pick);
    list.appendChild(div);
  });
  list.style.display='block';inp.classList.add('dropdown-open');
}

function updateAutocomplete(){
  var inp=document.getElementById('manual-input');
  var val=inp.value.trim();
  var list=document.getElementById('results-list');
  clearTimeout(_acTimer);
  _acSeq++;
  var seq=_acSeq;

  if(val.length<2){
    list.style.display='none';list.innerHTML='';inp.classList.remove('dropdown-open');return;
  }

  // Local search: title/artist
  var all=REPERTORIO.concat(ENGLISH),seen={},local=[];
  all.forEach(function(s){
    var key=norm(s.title+'||'+s.artist);
    if(seen[key])return;
    var scT=fuzzyScore(s.title,val);
    var scA=s.artist?fuzzyScore(s.artist,val):999;
    var sc=scT>=0?scT:(scA>=0&&scA<=1?scA+5:-1);
    if(sc>=0){seen[key]=true;local.push({title:s.title,artist:s.artist,sc:sc});}
  });
  // Also search lyrics hints
  var nval=norm(val);
  if(nval.length>=4&&typeof LYRICS_HINTS!=='undefined'){
    LYRICS_HINTS.forEach(function(entry){
      var key=norm(entry.title+'||'+(entry.artist||''));
      if(seen[key])return;
      var matched=entry.hints.some(function(h){return norm(h).indexOf(nval)!==-1||nval.indexOf(norm(h))!==-1;});
      if(matched){seen[key]=true;local.push({title:entry.title,artist:entry.artist||'',sc:0.5});}
    });
  }
  local.sort(function(a,b){return a.sc-b.sc;});
  local=local.slice(0,5);
  if(local.length) showDropdownResults(inp,list,local);

  // Remote lyric search: trigger if 3+ words or 20+ chars
  var words=val.split(' ').filter(Boolean);
  if(words.length<3&&val.length<20) return;

  _acTimer=setTimeout(function(){
    if(seq!==_acSeq) return; // newer search superseded this one
    // Use lrclib search — it indexes both titles and lyrics
    fetch('https://lrclib.net/api/search?q='+encodeURIComponent(val),
      {headers:{'Lrclib-Client':'KaraokeApp/1.0'}})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(arr){
      if(seq!==_acSeq||!arr||!arr.length) return;
      var seen2={};
      local.forEach(function(m){seen2[norm(m.title+'||'+m.artist)]=1;});
      var remote=[];
      arr.forEach(function(item){
        if(!item.trackName) return;
        var k=norm(item.trackName+'||'+(item.artistName||''));
        if(!seen2[k]){seen2[k]=1;remote.push({title:item.trackName,artist:item.artistName||''});}
      });
      // Put remote results first when they come from lyric search
      var combined=(local.length?local:[]).concat(remote.slice(0,5));
      if(seq===_acSeq) showDropdownResults(inp,list,combined.slice(0,6));
    })
    .catch(function(){});
  }, 700);
}

function manualSearch(){
  var val=document.getElementById('manual-input').value.trim();
  if(!val){setMsg('idle-msg','Escribe algo para buscar.');return;}
  var list=document.getElementById('results-list');
  list.style.display='none';list.innerHTML='';
  document.getElementById('manual-input').classList.remove('dropdown-open');
  setMsg('idle-msg','Buscando...','info');
  fetch('https://lrclib.net/api/search?q='+encodeURIComponent(val),{headers:{'Lrclib-Client':'KaraokeApp/1.0'}})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(arr){
      if(!arr||!arr.length){
        setMsg('idle-msg','Buscando por letra...','info');
        return fetch('https://lrclib.net/api/search?q='+encodeURIComponent(val)+'&type=lyrics',{headers:{'Lrclib-Client':'KaraokeApp/1.0'}})
          .then(function(r){return r.ok?r.json():[];});
      }
      return arr;
    })
    .then(function(arr){
      if(!arr||!arr.length){setMsg('idle-msg','No encontrado. Prueba otro fragmento.');return;}
      var parts=val.split(/\s*-\s*/);var qa=parts.length>1?parts[parts.length-1]:'';
      arr.sort(function(a,b){return score(a,qa)-score(b,qa);});
      var seen={},deduped=[];
      arr.forEach(function(item){
        var k=norm(item.trackName||'')+'||'+norm(item.artistName||'');
        if(!seen[k]){seen[k]=true;deduped.push(item);}
      });
      if(deduped.length===1){selectResult(deduped[0]);return;}
      setMsg('idle-msg','');
      list.innerHTML='';
      deduped.slice(0,8).forEach(function(item){
        var div=document.createElement('div');div.className='result-item';
        var t=document.createElement('div');t.className='result-title';t.textContent=item.trackName||'-';
        var a=document.createElement('div');a.className='result-artist';a.textContent=item.artistName||'';
        div.appendChild(t);if(item.artistName)div.appendChild(a);
        div.addEventListener('click',function(){list.style.display='none';setMsg('idle-msg','');selectResult(item);});
        list.appendChild(div);
      });
      list.style.display='block';
    })
    .catch(function(){setMsg('idle-msg','Error de conexion. Revisa internet.');});
}

function searchLrclib(val){
  var parts=val.split(/\s*-\s*/);var qa=parts.length>1?parts[parts.length-1]:'';
  return fetch('https://lrclib.net/api/search?q='+encodeURIComponent(val),{headers:{'Lrclib-Client':'KaraokeApp/1.0'}})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(arr){
      if(!arr||arr.length===0)return false;
      var normVal=norm(val);
      var artistMatches=arr.filter(function(item){return norm(item.artistName||'').indexOf(normVal)!==-1;});
      if(artistMatches.length>=arr.length*0.4){
        var seen={};var ded=[];
        arr.forEach(function(item){var k=norm(item.trackName||'');if(!seen[k]&&!isSecondary(item)){seen[k]=true;ded.push(item);}});
        if(ded.length<3)arr.forEach(function(item){var k=norm(item.trackName||'');if(!seen[k]){seen[k]=true;ded.push(item);}});
        showList(ded.slice(0,8));return true;
      }
      arr.sort(function(a,b){return score(a,qa)-score(b,qa);});
      var best=arr[0],second=arr[1];
      var diff=second?(score(second,qa)-score(best,qa)):999;
      if(diff<8&&second&&norm(best.trackName||'')===norm(second.trackName||'')&&norm(best.artistName||'')!==norm(second.artistName||'')){showList(arr.slice(0,5));}
      else{selectResult(best);}
      return true;
    }).catch(function(){return false;});
}

function showList(arr){
  var seen={},ded=[];
  arr.forEach(function(item){var k=norm(item.trackName||'')+'||'+norm(item.artistName||'');if(!seen[k]){seen[k]=true;ded.push(item);}});
  if(ded.length===1){selectResult(ded[0]);return;}
  setMsg('idle-msg','Elige la canción:','info');
  var list=document.getElementById('results-list');list.innerHTML='';
  ded.forEach(function(item){
    var div=document.createElement('div');div.className='result-item';
    var t=document.createElement('div');t.className='result-title';t.textContent=item.trackName||'—';
    var a=document.createElement('div');a.className='result-artist';a.textContent=item.artistName||'';
    div.appendChild(t);div.appendChild(a);
    div.addEventListener('click',function(){selectResult(item);list.style.display='none';setMsg('idle-msg','');});
    list.appendChild(div);
  });
  list.style.display='block';
}
function selectResult(item){song={title:item.trackName||'Desconocido',artist:item.artistName||''};document.getElementById('results-list').style.display='none';setMsg('idle-msg','');showFoundAndLoad(song.title,song.artist,item.id);}
function showFoundAndLoad(title,artist,lrcId){
  // Check hardcoded lyrics first
  var hkey=(title+'||'+artist).toLowerCase().replace(/[^a-z0-9|]/g,'');
  if(typeof HARDCODED_LYRICS!=='undefined'){
    for(var k in HARDCODED_LYRICS){
      if(hkey.indexOf(k.split('||')[0])!==-1&&(k.split('||')[1]===''||hkey.indexOf(k.split('||')[1])!==-1)){
        var lines=HARDCODED_LYRICS[k];
        var dur=lines.length*3500;
        var built=lines.map(function(text,i){return{time:i*(dur/lines.length),text:text};});
        song={title:title,artist:artist};
        document.getElementById('k-title').textContent=title;
        document.getElementById('k-artist').textContent=artist;
        lyrics=built;
        show('karaoke');
        beginKaraoke();
        return;
      }
    }
  }
  song={title:title,artist:artist||''};
  document.getElementById('found-title').textContent=title;
  document.getElementById('found-artist').textContent=artist||'';
  document.getElementById('loading-lyrics').style.display='flex';
  document.getElementById('found-btns').style.display='none';
  setMsg('found-msg','');show('found');
  fetchLyrics(lrcId).then(function(result){
    document.getElementById('loading-lyrics').style.display='none';
    if(!result||result.length===0){setMsg('found-msg','⚠️ No se encontró letra.');document.getElementById('found-btns').style.display='flex';return;}
    lyrics=result;beginKaraoke();
  }).catch(function(){document.getElementById('loading-lyrics').style.display='none';setMsg('found-msg','⚠️ Error de red.');document.getElementById('found-btns').style.display='flex';});
}
function fetchLyrics(lrcId){
  if(lrcId&&typeof lrcId==='number'){
    return fetch('https://lrclib.net/api/get/'+lrcId,{headers:{'Lrclib-Client':'KaraokeApp/1.0'}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){if(d&&d.syncedLyrics)return parseLRC(d.syncedLyrics);if(d&&d.plainLyrics)return buildPlain(d.plainLyrics);return searchLrclibLyrics();});
  }
  return searchLrclibLyrics();
}
function lrclibFetch(url,h){return fetch(url,{headers:h}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];});}
function pickBest(arr){
  if(!arr||!arr.length)return null;
  arr.sort(function(a,b){return score(a,song.artist)-score(b,song.artist);});
  for(var i=0;i<arr.length;i++){if(arr[i].syncedLyrics)return parseLRC(arr[i].syncedLyrics);}
  for(var j=0;j<arr.length;j++){if(arr[j].plainLyrics)return buildPlain(arr[j].plainLyrics);}
  return null;
}
function searchLrclibLyrics(){
  var h={'Lrclib-Client':'KaraokeApp/1.0'},base='https://lrclib.net/api/search';
  var title=song.title,artist=song.artist||'';
  // Try 1: exact track_name + artist_name
  var url1=artist?base+'?track_name='+encodeURIComponent(title)+'&artist_name='+encodeURIComponent(artist):base+'?q='+encodeURIComponent(title);
  // Try 2: q=title+artist (broader)
  var url2=base+'?q='+encodeURIComponent(title+(artist?' '+artist:''));
  // Try 3: q=title only (ignore artist, find any version)
  var url3=base+'?q='+encodeURIComponent(title);
  return lrclibFetch(url1,h).then(function(arr){
    var r=pickBest(arr);
    if(r)return r;
    return lrclibFetch(url2,h).then(function(arr2){
      var r2=pickBest(arr2);
      if(r2)return r2;
      return lrclibFetch(url3,h).then(function(arr3){
        return pickBest(arr3);
      });
    });
  }).catch(function(){return null;});
}
function parseLRC(lrc){var r=[];lrc.split('\n').forEach(function(line){var m=line.match(/\[(\d+):(\d+\.\d+)\](.*)/);if(m){var ms=(parseInt(m[1])*60+parseFloat(m[2]))*1000;var t=m[3].trim();if(t)r.push({time:ms,text:t});}});return r;}
function buildPlain(plain){var lines=plain.split('\n').filter(function(l){return l.trim();});var dur=lines.length*3600;return lines.map(function(text,i){return{time:i*(dur/lines.length),text:text};});}

function beginKaraoke(){
  if(!lyrics.length)return;
  document.getElementById('k-title').textContent=song.title;
  document.getElementById('k-artist').textContent=song.artist||'';
  speedIdx=3;updateBadge();
  buildDOM();show('karaoke');
  currentY=0;targetY=0;manualOffset=0;userScrolling=false;applyY(0);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    lineOffsets=[];document.querySelectorAll('.ll').forEach(function(el){lineOffsets.push(el.offsetTop);});
    kStart=performance.now();pausedAt=0;setPaused(false);
    stopTimer();kTimer=setInterval(tick,80);
  });});
}
function buildDOM(){
  var c=document.getElementById('lyrics-box');c.innerHTML='';
  lyrics.forEach(function(line){
    var el=document.createElement('div');el.className='ll';el.textContent=line.text;
    var t=line.time;el.addEventListener('click',function(){userScrolling=false;manualOffset=0;seekK(t);});
    c.appendChild(el);
  });
  var pb=document.createElement('div');pb.style.height='50vh';c.appendChild(pb);
}
function tick(){if(paused)return;updateAt(performance.now()-kStart);}
function updateAt(ms){
  var ems=ms*spd();
  var lines=document.querySelectorAll('.ll');if(!lines.length)return;
  var active=-1;
  for(var i=lyrics.length-1;i>=0;i--){if(ems>=lyrics[i].time){active=i;break;}}
  lines.forEach(function(el,i){el.classList.remove('active','past','next');if(i<active)el.classList.add('past');else if(i===active)el.classList.add('active');else if(i===active+1)el.classList.add('next');});
  if(!userScrolling){
    var win=document.getElementById('lyrics-win'),winH=win.clientHeight;
    if(active<0){targetY=0;}
    else{var lt=lineOffsets[active]!==undefined?lineOffsets[active]:lines[active].offsetTop;targetY=-(lt-winH/2+lines[active].offsetHeight/2);if(targetY>0)targetY=0;}
    currentY+=(targetY-currentY)*0.15;applyY(currentY);
  }
  var total=totalMs();
  document.getElementById('prog-fill').style.width=Math.min(100,(ems/total)*100)+'%';
  document.getElementById('t-cur').textContent=fmt(ems);
  document.getElementById('t-tot').textContent=fmt(total);
}
function totalMs(){return lyrics.length?lyrics[lyrics.length-1].time+5000:1;}
function fmt(ms){var s=Math.floor(Math.max(0,ms)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTimer(){if(kTimer){clearInterval(kTimer);kTimer=null;}}
function restartK(){userScrolling=false;manualOffset=0;currentY=0;targetY=0;applyY(0);speedIdx=3;updateBadge();kStart=performance.now();pausedAt=0;setPaused(false);updateAt(0);}
function seekK(ms){var raw=ms/spd();kStart=performance.now()-raw;pausedAt=raw;updateAt(raw);}
</script>
</body>
</html>
